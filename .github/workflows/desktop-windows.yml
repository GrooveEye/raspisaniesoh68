name: Build Desktop (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Needed only if you ever enable publishing to Releases.
# (Safe to keep even when we only upload artifacts.)
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm ci fails if package-lock is out of sync; npm install is more tolerant.
        run: npm install --no-audit --no-fund

      - name: Build web (Vite)
        run: npm run build

      - name: Install WiX (for MSI)
        run: choco install wixtoolset -y

      - name: Build Electron (NSIS + MSI)
        # Disable auto-publish to GitHub Releases; we only upload artifacts below.
        run: npx electron-builder --config electron-builder.yml --win --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/*.exe
            release/*.msi
            release/*.zip
