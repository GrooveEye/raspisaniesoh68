# electron-builder configuration (no package.json edits required)
# Docs: https://www.electron.build/configuration/configuration

appId: app.schoolplanner.desktop
productName: School Planner 2026

# electron-builder will override package.json fields during CI/build
extraMetadata:
  main: electron/main.cjs

files:
  - dist/**
  - electron/**

directories:
  output: release

asar: true

win:
  icon: public/favicon.ico
  target:
    - nsis
    - msi

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

publish:
  - provider: github
    releaseType: draft
